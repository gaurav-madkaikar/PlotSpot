[project]
name = "movie-companion"
version = "0.1.0"
description = "Learning-first movie companion API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "ddgs==9.16.0",
    "python-dotenv>=1,<2",
    "chromadb>=1,<2",
    "argon2-cffi>=25.1,<26",
    "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/movie_companion"]
